version: 2.1
orbs:
  # eventuate-gradle-build-and-test: "eventuate_io/eventuate-gradle-build-and-test@0.2.10"
  # Some features unsupported by above ORB e.g. set-multi-arch-image-env-vars.sh
  build-and-test:
    jobs:
      build-and-test:
        parameters:
          script:
            description: the script to execute
            type: string
          resource_class:
            description: the resource class
            type: string
            default: 'medium'
          skip_multi_arch_env_vars:
            description: if set don't set multi-arch env vars
            type: string
            default: ''
        machine:
          image: ubuntu-2204:2024.01.1
        resource_class: <<parameters.resource_class>>
        working_directory: ~/eventuate-messaging-kafka
        steps:
          - checkout
          - restore_cache:
              keys:
                - eventuate-messaging-kafka-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
                - eventuate-messaging-kafka-
          - run:
              command: |
                ./gradlew testClasses aggregateJavaDocs
          - save_cache:
              paths:
                - ~/.gradle
              key: eventuate-messaging-kafka-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          - run:
              command: |
                if [ -z "<<parameters.skip_multi_arch_env_vars>>" ] ; then
                  . set-multi-arch-image-env-vars.sh
                fi
                <<parameters.script>>
          - run:
              name: Save test results
              command: ./.circleci/save-containers-and-tests.sh
              when: always
          - store_test_results:
              path: ~/junit
          - store_artifacts:
              path: ~/junit
          - store_artifacts:
              path: ~/container-logs
  native-image:
    jobs:
      build:
        parameters:
          script:
            description: the script to execute
            type: string
          resource_class:
            description: the resource class, which determines the platform
            type: string
        machine:
          image: ubuntu-2404:2024.11.1
        resource_class: <<parameters.resource_class>>
        working_directory: ~/eventuate-messaging-kafka
        steps:
          - checkout
          - run:
              name: docker build
              command: |
                . set-multi-arch-image-env-vars.sh
                echo ${DOCKER_PASSWORD?} | docker login -u ${DOCKER_USER_ID?} --password-stdin
                <<parameters.script>>
      merge:
        parameters:
          script:
            description: the script to execute
            type: string
        docker:
          - image: cimg/base:stable
        working_directory: ~/eventuate-messaging-kafka
        steps:
          - checkout
          - setup_remote_docker
          - run:
              name: docker buildx imagetools create
              command: |
                . set-multi-arch-image-env-vars.sh
                echo ${DOCKER_PASSWORD?} | docker login -u ${DOCKER_USER_ID?} --password-stdin
                <<parameters.script>>
jobs:
  deploy-multi-arch:
    docker:
      - image: cimg/base:stable
    working_directory: ~/eventuate-common
    steps:
      - checkout
      - run:
          command: |
            . set-multi-arch-image-env-vars.sh
            ./deploy-multi-arch.sh
workflows:
  version: 2
  build-test-and-deploy:
    jobs:
      - native-image/build:
          name: build-native-image-kafka-intel
          script: ./build-docker-image-native.sh $KAFKA_MULTI_ARCH_IMAGE kafka/Dockerfile kafka
          resource_class: medium
          context:
            - publish
      - native-image/build:
          name: build-native-image-kafka-arm
          script: ./build-docker-image-native.sh $KAFKA_MULTI_ARCH_IMAGE kafka/Dockerfile kafka
          resource_class: arm.medium
          context:
            - publish
      - native-image/merge:
          name: build-multi-arch-images
          script: ./merge-docker-image-multi-arch.sh $KAFKA_MULTI_ARCH_IMAGE
          context:
            - publish
          requires:
            - build-native-image-kafka-intel
            - build-native-image-kafka-arm
      - build-and-test/build-and-test:
          name: build-and-test-intel
          script: ./build-and-test-all.sh
          requires:
            - build-multi-arch-images
      - build-and-test/build-and-test:
          name: build-and-test-arm
          script: ./build-and-test-all.sh
          resource_class: arm.medium
          requires:
            - build-multi-arch-images
      - deploy-multi-arch:
          context:
            - publish
          requires:
            - build-and-test-intel
            - build-and-test-arm
      - build-and-test/build-and-test:
          name: deploy-artifacts
          script: ./deploy-artifacts.sh
          context:
            - publish
          requires:
            - build-and-test-intel
            - build-and-test-arm
