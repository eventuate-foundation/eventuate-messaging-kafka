buildscript {
    repositories {
        mavenCentral()
        maven {
          url "https://plugins.gradle.org/m2/"
        }
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }
    dependencies {
        classpath "com.avast.gradle:gradle-docker-compose-plugin:$dockerComposePluginVersion"
        classpath "io.eventuate.plugins.gradle:eventuate-plugins-gradle-publish:$eventuatePluginsGradleVersion"
    }
}

apply plugin: 'docker-compose'
apply plugin: "io.eventuate.plugins.gradle.publish.EventuatePublish"

allprojects {
    group = "io.eventuate.messaging.kafka"
}

subprojects {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }

    if (!project.name.endsWith("-bom"))
        dependencies {
            implementation "org.slf4j:slf4j-api:$slf4jVersion"
            testImplementation "org.assertj:assertj-core:$assertjVersion"
            testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformLauncherVersion"
        }

    // Tests use the Kafka image that CI built, instead of building kafka/Dockerfile
    tasks.withType(Test).configureEach {
        def kafkaImage = System.getenv("KAFKA_MULTI_ARCH_IMAGE")
        if (kafkaImage)
            systemProperty "eventuate.messaging.kafka.image", kafkaImage
    }
}

gradle.projectsEvaluated {
    task aggregateJavaDocs(type: Javadoc) {
        description = 'Aggregated Javadoc API documentation of all subprojects.'
        group = JavaBasePlugin.DOCUMENTATION_GROUP

        destinationDir file("$buildDir/docs/javadoc")
    }
}

dockerCompose {
    projectName = null
    environment.put "EVENTUATE_COMMON_DATABASE_VERSION", eventuateCommonDatabaseImageVersion
    environment.put "EVENTUATE_COMMON_ZOOKEEPER_VERSION", eventuateCommonZookeeperImageVersion
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
